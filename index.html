<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.S. Baby Names Explorer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍼</text></svg>">
    <meta name="description" content="US Baby Names - Explore 145 years of names from 375 million babies. Data from the Social Security Administration">
    <meta property="og:title" content="US Baby Names">
    <meta property="og:description" content="Explore 145 years of names from 375 million babies. Data from the Social Security Administration">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://us-baby-names.com">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="US Baby Names">
    <meta name="twitter:description" content="Explore 144 years of naming trends across 372 million records. Data from the Social Security Administration">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-qfOAQajDHgXPdoDbQjOgY.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
</head>
<body>
    <div class="page-grain"></div>

    <header>
        <p class="header-eyebrow">Social Security Administration &mdash; 1880 to 2025</p>
        <h1>US Baby Names</h1>
        <p class="header-sub">Explore 145 years of names from 375 million babies</p>
    </header>

    <div class="controls">
        <div class="control-group">
            <label>Search Name</label>
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.5" y1="12.5" x2="17" y2="17"/></svg>
                <input type="text" id="search-input" placeholder="Try Mary, James, Luna..." autocomplete="off">
                <div class="typeahead-dropdown hidden" id="typeahead-dropdown"></div>
            </div>
        </div>

        <div class="control-group control-group-slider">
            <label>Year Range</label>
            <div class="range-slider">
                <span class="range-label" id="range-label-start">1880</span>
                <div class="range-track-wrapper">
                    <input type="range" id="year-start" min="1880" max="2025" value="1880">
                    <input type="range" id="year-end" min="1880" max="2025" value="2025">
                    <div class="range-track-fill" id="range-track-fill"></div>
                </div>
                <span class="range-label" id="range-label-end">2025</span>
            </div>
        </div>
    </div>

    <!-- Name Detail Section -->
    <div class="section hidden" id="name-detail-section">
        <div class="section-header">
            <h2 id="name-detail-title">Name Detail</h2>
        </div>
        <div class="charts-row">
            <div class="chart-container">
                <div class="chart-title">Count per Year</div>
                <div id="count-chart"></div>
            </div>
            <div class="chart-container">
                <div class="chart-title">Rank per Year</div>
                <div id="rank-chart"></div>
            </div>
        </div>
    </div>

    <!-- Top Names Section -->
    <div class="section" id="top-names-section">
        <div class="section-header">
            <h2>Top Names</h2>
            <div class="top-controls">
                <select id="top-year-select"></select>
                <button id="range-mode-btn">Use Date Range Above</button>
                <span class="range-mode-label hidden" id="range-mode-label"></span>
                <div class="count-toggle" id="top-count-toggle">
                    <button data-count="10" class="active">Top 10</button>
                    <button data-count="25">Top 25</button>
                </div>
            </div>
        </div>
        <div class="charts-row" id="top-charts-row">
            <div class="chart-container" id="top-female-container">
                <div class="chart-title">Top Female Names</div>
                <div id="top-female-chart"></div>
            </div>
            <div class="chart-container" id="top-male-container">
                <div class="chart-title">Top Male Names</div>
                <div id="top-male-chart"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>Data from the U.S. <a target="_blank" href="https://www.ssa.gov/oact/babynames/limits.html">Social Security Administration</a>.&nbsp;Visualization &copy; <a target="_blank" href="https://justinjoyce.dev/projects/">Justin Joyce</a>.</p>
    </footer>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
